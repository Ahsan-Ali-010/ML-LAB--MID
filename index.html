<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML LAB MID Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; text-align: center; margin-bottom: 30px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fafafa; }
        h2 { color: #0f172a; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #475569; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        button:hover { background-color: #1d4ed8; }
        .result { margin-top: 15px; padding: 12px; border-radius: 6px; background: #e0f2fe; color: #0369a1; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ML Model Interactive Dashboard</h1>

        <!-- Housing Regression -->
        <div class="section">
            <h2>1. California Housing Price Prediction</h2>
            <div class="grid">
                <div><label>Median Income</label><input type="number" id="MedInc" value="8.32" step="0.1"></div>
                <div><label>House Age</label><input type="number" id="HouseAge" value="41"></div>
                <div><label>Average Rooms</label><input type="number" id="AveRooms" value="6.98" step="0.1"></div>
                <div><label>Population</label><input type="number" id="Population" value="322"></div>
            </div>
            <button onclick="predictHousing()">Predict House Price</button>
            <div id="housingResult" class="result" style="display:none;"></div>
        </div>

        <!-- Iris Classification -->
        <div class="section">
            <h2>2. Iris Species Classification</h2>
            <div class="grid">
                <div><label>Sepal Length (cm)</label><input type="number" id="sepal_length" value="5.1" step="0.1"></div>
                <div><label>Sepal Width (cm)</label><input type="number" id="sepal_width" value="3.5" step="0.1"></div>
                <div><label>Petal Length (cm)</label><input type="number" id="petal_length" value="1.4" step="0.1"></div>
                <div><label>Petal Width (cm)</label><input type="number" id="petal_width" value="0.2" step="0.1"></div>
            </div>
            <label>Decision Threshold</label>
            <input type="number" id="threshold" value="0.5" min="0" max="1" step="0.05" style="margin-bottom: 15px;">
            <button onclick="predictIris()">Classify Species</button>
            <div id="irisResult" class="result" style="display:none;"></div>
        </div>

        <!-- Sentiment Analysis -->
        <div class="section">
            <h2>3. Review Sentiment Analysis</h2>
            <textarea id="sentimentText" rows="3" placeholder="Enter review text...">The food was delicious and the service was wonderful!</textarea>
            <button onclick="predictSentiment()" style="margin-top: 15px;">Analyze Sentiment</button>
            <div id="sentimentResult" class="result" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        async function predictHousing() {
            const data = {
                MedInc: parseFloat(document.getElementById('MedInc').value),
                HouseAge: parseFloat(document.getElementById('HouseAge').value),
                AveRooms: parseFloat(document.getElementById('AveRooms').value),
                Population: parseFloat(document.getElementById('Population').value)
            };
            const res = await fetch(`${API}/predict/housing`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const out = await res.json();
            const div = document.getElementById('housingResult');
            div.style.display = 'block';
            div.innerText = `Estimated Price: ${out.formatted_price}`;
        }

        async function predictIris() {
            const threshold = parseFloat(document.getElementById('threshold').value);
            const data = {
                "sepal length (cm)": parseFloat(document.getElementById('sepal_length').value),
                "sepal width (cm)": parseFloat(document.getElementById('sepal_width').value),
                "petal length (cm)": parseFloat(document.getElementById('petal_length').value),
                "petal width (cm)": parseFloat(document.getElementById('petal_width').value)
            };
            const res = await fetch(`${API}/predict/iris?threshold=${threshold}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const out = await res.json();
            const div = document.getElementById('irisResult');
            div.style.display = 'block';
            div.innerText = `Result: ${out.predicted_species} (Probability: ${(out.probability * 100).toFixed(1)}%)`;
        }

        async function predictSentiment() {
            const text = document.getElementById('sentimentText').value;
            const res = await fetch(`${API}/predict/sentiment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const out = await res.json();
            const div = document.getElementById('sentimentResult');
            div.style.display = 'block';
            div.innerText = `Sentiment: ${out.sentiment} (Confidence: ${(out.confidence * 100).toFixed(1)}%)`;
        }
    </script>
</body>
</html>
